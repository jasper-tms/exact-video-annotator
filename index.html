<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>exact-video-annotator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/panels.css">
  <link rel="stylesheet" href="css/tables.css">
  <!-- mp4box.js must be loaded before the engine (provides MP4Box and DataStream). -->
  <script src="https://unpkg.com/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
  <!-- Pinned release tag, never a branch (see the engine README's consuming notes). -->
  <script src="https://cdn.jsdelivr.net/gh/jasper-tms/exact-video-engine.js@v2.5.0/exact-video-engine.js"></script>
</head>
<body>
  <header id="toolbar">
    <span id="application-title">exact-video-annotator</span>
    <!-- Everything between the title and the hovered-pixel readout scrolls
         sideways rather than shrinking when the window is too narrow — the
         title and the readout are the two things that must always stay put. -->
    <div id="toolbar-scroll-region">
      <span class="toolbar-group">
        <button id="open-video-button" title="Open a video file">Open video</button>
        <button id="import-annotations-button" title="Import an annotations JSON file">Import</button>
        <button id="export-annotations-button" title="Export annotations as JSON">Export</button>
      </span>
      <span class="toolbar-group">
        <button id="settings-button" title="Open settings">Settings…</button>
      </span>
    </div>
    <span id="hovered-pixel-label" title="The video pixel under the cursor"></span>
  </header>

  <!-- First screenful: the canvas owns the screen. A slim icon rail on the
       left holds the tools that are needed mid-interaction; transport and a
       single-row layer tab bar sit below the canvas. Everything else lives
       further down the page: scrolling the wheel over the canvas zooms,
       scrolling it anywhere else scrolls the page down to the details. -->
  <main id="viewport-section">
    <nav id="tool-rail">
      <!-- Each tool also selects and moves any existing annotation, of any
           kind; pressing a tool's hotkey (or clicking its button) while it is
           already active just blinks the button (every tool pans on its own
           now, so there's no useful fallback tool to switch to). Hotkeys for
           these tool buttons ('1', '2', ...) are assigned dynamically by
           main.js from their position here, not written statically below. -->
      <button data-tool="pan" class="rail-button" title="Pan the view">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <polygon points="12,1 15.5,6 13,6 13,18 15.5,18 12,23 8.5,18 11,18 11,6 8.5,6"></polygon>
          <polygon points="1,12 6,8.5 6,11 18,11 18,8.5 23,12 18,15.5 18,13 6,13 6,15.5"></polygon>
        </svg>
      </button>
      <button data-tool="point" class="rail-button" title="Add points">●</button>
      <button data-tool="line" class="rail-button" title="Draw lines">╱</button>
      <button data-tool="polyline" class="rail-button" title="Draw polylines">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5,21 L5,12 L11.36,5.64 L20.36,5.64"></path>
          <path d="M20.36,5.64 L5,21" stroke-dasharray="3,2.5"></path>
          <circle cx="5" cy="21" r="1.3" fill="currentColor" stroke="none"></circle>
          <circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"></circle>
          <circle cx="11.36" cy="5.64" r="1.3" fill="currentColor" stroke="none"></circle>
          <circle cx="20.36" cy="5.64" r="1.3" fill="currentColor" stroke="none"></circle>
        </svg>
      </button>
      <!-- Pixel-wise segmentation isn't implemented yet, so this button has no
           backing tool at all — it always shows a "not implemented" message. -->
      <button id="paint-tool-button" class="rail-button" title="Paint pixels — not implemented yet">🖌</button>
      <!-- Frame-agnostic toggle: when on (∞ lit), newly drawn annotations apply
           across every frame instead of being anchored to the current frame.
           Defaults to off; it never changes existing annotations. -->
      <button id="frame-agnostic-toggle" class="rail-button" data-hotkey="a"
              title="Frame-agnostic mode off: new annotations anchor to the current frame (a)">∞</button>
      <span class="rail-divider"></span>
      <button id="undo-button" class="rail-button" title="Undo (Cmd/Ctrl+Z)" disabled>↩</button>
      <button id="redo-button" class="rail-button" title="Redo (Shift+Cmd/Ctrl+Z)" disabled>↪</button>
      <span class="rail-divider"></span>
      <button id="fit-view-button" class="rail-button" data-hotkey="f" title="Fit the view to the content (f)">⛶</button>
      <!-- Pinned to the bottom of the rail: scroll the page down to the details
           below the canvas, then back up. Its glyph reflects the direction it
           will scroll (down when at the top, up otherwise). -->
      <button id="scroll-toggle-button" class="rail-button rail-button-bottom" data-hotkey="0"
              title="Scroll down to the details (0)">
        <svg class="scroll-arrow" viewBox="0 0 24 24" width="22" height="22"
             fill="none" stroke="currentColor" stroke-width="4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="2" x2="12" y2="19"></line>
          <polyline points="4 12 12 20 20 12"></polyline>
        </svg>
      </button>
    </nav>
    <div id="canvas-column">
      <div id="stage-container">
        <canvas id="stage-canvas"></canvas>
        <div id="drop-hint">
          <p>Drop a video here, or use <strong>Open video</strong>.</p>
          <p class="drop-hint-details">Videos are read lazily from disk — arbitrarily large
             files are fine, and nothing is uploaded anywhere.</p>
        </div>
        <!-- Containers with no central index (WebM/MKV, fragmented MP4, Ogg)
             are indexed by a full pass over the file, which is the one part of
             opening a clip whose cost grows with its length. This reports that
             pass — one line per video, since several clips can be indexing at
             once — and stays up while a clip plays if its index is still
             growing underneath it. -->
        <div id="indexing-status" hidden></div>
      </div>
      <div id="transport-container"></div>
      <div id="layer-tabs-container"></div>
    </div>
  </main>

  <!-- Below the fold: details for the selected layer, then the shared
       registries and the annotations table, with all the space they want. -->
  <section id="details-section">
    <div id="layer-detail-container" class="panel"></div>
    <div id="class-manager-container" class="panel"></div>
    <div id="annotations-table-container" class="panel"></div>
  </section>

  <!-- Each video engine paints into its own canvas + <video> pair, created
       dynamically inside a per-video host <div> here and composited onto the
       stage canvas by that video's layer. The hosts must have a real size
       (the engine sizes its canvas backing store from its parent), so this
       container is positioned far offscreen rather than display: none. -->
  <div id="video-host" aria-hidden="true"></div>

  <div id="toast-container" role="status" aria-live="polite"></div>

  <input type="file" id="video-file-input" accept="video/*,.mp4,.mov,.webm,.m4v" hidden>
  <input type="file" id="annotations-file-input" accept="application/json,.json" hidden>

  <script type="module" src="js/main.js"></script>
</body>
</html>
